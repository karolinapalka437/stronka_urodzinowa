<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misja 1 — Marsaxlokk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-y:auto;

    color:white;
    font-family:'Montserrat', sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.45)
    ),
    url('https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=1800&auto=format&fit=crop');

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:scroll;
}

.party-glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background:
    radial-gradient(circle at top right,
    rgba(255,0,140,0.18),
    transparent 25%),

    radial-gradient(circle at bottom left,
    rgba(255,200,0,0.12),
    transparent 25%);
}

.overlay{
    position:fixed;
    inset:0;
    backdrop-filter: blur(1px);
    z-index:0;
}

.container{
    position:relative;
    z-index:2;

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:24px 16px;
}

.card{
    width:100%;
    max-width:920px;

    padding:48px 28px;

    background:rgba(15,15,15,0.45);

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(8px);

    border-radius:30px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.45);

    text-align:center;
}

.timer-block{
    margin-bottom:44px;
}

.timer-label{
    font-size:0.72rem;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:0.65;
    margin-bottom:14px;
}

.timer-display{
    font-family:'Cormorant Garamond', serif;
    font-size:6.5rem;
    font-weight:700;
    line-height:1;
    color:#ffe6bf;
    letter-spacing:4px;
}

.divider{
    width:110px;
    height:1px;

    background:rgba(255,255,255,0.25);

    margin:0 auto 40px auto;
}

.mission-label{
    font-size:0.78rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#f3d5a9;
    margin-bottom:16px;
}

.task{
    font-family:'Cormorant Garamond', serif;
    font-size:2.1rem;
    line-height:1.35;
    margin-bottom:28px;
    color:white;
    max-width:760px;
    margin-left:auto;
    margin-right:auto;
}

.task-details{
    max-width:650px;
    margin:0 auto;
    color:rgba(255,255,255,0.82);
    line-height:2;
    font-size:0.98rem;
}

.note{
    max-width:650px;
    margin:40px auto 0 auto;
    padding-top:40px;
    border-top:1px solid rgba(255,255,255,0.15);
    color:rgba(255,200,100,0.85);
    font-size:0.92rem;
    line-height:1.6;
    font-style:italic;
}

@media(max-width:768px){

    .container{
        align-items:flex-start;
        padding:18px 14px 30px;
    }

    .card{
        padding:38px 22px;
        border-radius:24px;
    }

    .timer-display{
        font-size:4rem;
        letter-spacing:2px;
    }

    .task{
        font-size:1.7rem;
    }

    .task-details{
        font-size:0.94rem;
        line-height:1.8;
    }

    body{
        background-position:center top;
    }
}

</style>
</head>

<body>

<div class="party-glow"></div>
<div class="overlay"></div>

<div class="container">
    <div class="card">

        <div class="timer-block">
            <div class="timer-label">Czas misji</div>
            <div class="timer-display" id="timer">48:00:00</div>
        </div>

        <div class="divider"></div>

        <div class="mission-label">
            Zadanie pierwsze
        </div>

        <div class="task">
            Znajdź człowieka, który wygląda,
            jakby znał wszystkie plotki Marsaxlokk.
        </div>

        <div class="task-details">
            Zrób z nim zdjęcie i dowiedz się:
            <br><br>
            — skąd jest<br>
            — co poleca do picia<br>
            — czy wie, gdzie ukryła się młodość solenizantki
        </div>

        <div class="note">
            Jak ukończysz zadanie, kolejne pojawią w świecie rzeczywistym.
        </div>

    </div>
</div>

<script>
  const STORAGE_KEY = 'misja1_end_time';
  const DURATION = 48 * 3600; // seconds

  // Store end time in localStorage so timer survives page reloads
  if (!localStorage.getItem(STORAGE_KEY)) {
    const endTime = Date.now() + DURATION * 1000;
    localStorage.setItem(STORAGE_KEY, endTime);
  }

  const endTime = parseInt(localStorage.getItem(STORAGE_KEY), 10);

  function formatTime(sec) {
    if (sec < 0) sec = 0;
    const h = String(Math.floor(sec / 3600)).padStart(2, '0');
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function updateTimer() {
    const remaining = Math.floor((endTime - Date.now()) / 1000);
    const display = document.getElementById('timer');
    display.textContent = formatTime(remaining);
    if (remaining <= 0) {
      clearInterval(interval);
    }
  }

  updateTimer();
  const interval = setInterval(updateTimer, 1000);
</script>

</body>
</html>
